name: qPCR Simulator v2.0 CI
on: [push, pull_request]
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint & Type Check
      run: |
        pip install flake8 mypy
        flake8 core/ analysis/ gui/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
    - name: Run Tests with Coverage
      run: |
        pip install pytest-cov
        pytest tests/ -v --cov=core --cov=analysis --cov-report=xml
    - name: Build Executable (Dry Run)
      run: |
        pip install pyinstaller
        pyinstaller --onefile --name qPCR_Test --hidden-import=scipy.optimize main.py || echo "Build skipped for CI"